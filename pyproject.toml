[project]
name = "manga-access-ai"
version = "0.1.0"
description = "Pipeline multimodal pour rendre les mangas japonais accessibles aux personnes aveugles et malvoyantes."
requires-python = ">=3.11"
dependencies = [
    "manga-ocr>=0.1.8",
    "kokoro-onnx>=0.3.0",
    "soundfile>=0.12.0",
    "pydub>=0.25.1",
    # audioop a été retiré de la stdlib en Python 3.13 ; pydub en dépend
    # (via un repli sur pyaudioop, absent) — backport officiel CPython.
    # Marqueur requis : audioop-lts n'existe pas pour Python <3.13 (inutile,
    # audioop natif est encore présent dans la stdlib à ces versions).
    "audioop-lts>=0.2.2; python_version >= '3.13'",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
    # <5.0 : transformers 5.x casse la conversion tokenizer lent->rapide
    # pour le tokenizer TrOCR interne à Magiv2 (RoBERTa/BPE sans tokenizer.json)
    "transformers>=4.45.0,<5.0",
    # Dépendances runtime de Magiv2 (trust_remote_code),
    # non déclarées dans le README officiel — découvertes à l'exécution
    "einops>=0.7.0",
    "pulp>=2.7.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0",
    "shapely>=2.0.0",
    "networkx>=3.0",
    "timm>=0.9.0",
    # sentencepiece : dépendance transitive de transformers pour le tokenizer
    # TrOCR interne à Magiv2 (instancié systématiquement dans Magiv2Model.__init__,
    # même si on n'utilise pas predict_ocr()) — invisible dans les imports
    # statiques du dépôt, découverte uniquement à l'exécution
    "sentencepiece>=0.1.99",
    "loguru>=0.7.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manga_access"]
