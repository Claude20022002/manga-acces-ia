[project]
name = "manga-access-ai"
version = "0.1.0"
description = "Pipeline multimodal pour rendre les mangas japonais accessibles aux personnes aveugles et malvoyantes."
requires-python = ">=3.11"
dependencies = [
    "manga-ocr>=0.1.8",
    "kokoro-onnx>=0.3.0",
    "pydub>=0.25.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0",
    "Pillow>=10.0.0",
    "loguru>=0.7.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manga_access"]
